[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evidentia"
version = "0.1.0"
description = "A verifiable intelligence layer for research workflows"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Evidentia Contributors" },
]
keywords = ["research", "agent", "citations", "evidence", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "httpx>=0.27.0",
    "celery[redis]>=5.4.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "click>=8.1.0",
    "rich>=13.9.0",
    "slowapi>=0.1.9",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "email-validator>=2.1.0",
]

[project.optional-dependencies]
retrieval = [
    "pgvector>=0.3.0",
    "sentence-transformers>=3.3.0",
    "rank-bm25>=0.2.2",
]
pdf = [
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
evidentia = "evidentia.cli.main:cli"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = [
    "B008",    # function-call-in-default-argument — standard FastAPI Depends() pattern
    "UP042",   # replace-str-enum — StrEnum requires Python 3.11+ and changes serialization
    "SIM105",  # suppressible-exception — explicit try/except is often clearer
]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E501"]  # migrations have long SQL lines
"tests/*" = ["B017"]    # assert-raises-exception is fine in tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
